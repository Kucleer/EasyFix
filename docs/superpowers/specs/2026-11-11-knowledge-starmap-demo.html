<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>知识星空 demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{background:#f4f6fb;color:#1f2a44}
.home{max-width:1080px;margin:0 auto;padding:28px 32px}
.home h1{font-size:22px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:15px}
.mini{position:relative;height:280px;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#030306}
.mini canvas{position:absolute;inset:0;width:100%;height:100%}
.mini .count{position:absolute;left:16px;bottom:12px;color:#f3d79a;font-size:13px;letter-spacing:1px;text-shadow:0 0 8px rgba(0,0,0,.8)}
.mini .count b{font-size:24px;margin-right:4px}
.stub{height:60px;border-radius:10px;background:#f4f6fb;margin-top:10px}
.sky{position:fixed;inset:0;display:none;background:#030306;color:#f3e6c4}
.sky.show{display:block;animation:fade .6s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.top{position:absolute;left:26px;top:20px;display:flex;align-items:center;gap:16px}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;color:rgba(243,230,196,.45);font-size:15px;padding:4px 10px;cursor:pointer;letter-spacing:2px}
.tabs button.on{color:#f6d68c;text-shadow:0 0 12px rgba(246,214,140,.6)}
.count2{color:rgba(243,230,196,.6);font-size:13px;letter-spacing:1px}
.count2 b{color:#f6d68c;font-size:18px}
.pal{margin-left:18px;padding-left:14px;border-left:1px solid rgba(243,230,196,.18)}
.pal button{font-size:13px}
.legend{position:absolute;left:28px;bottom:22px;display:none;gap:16px;font-size:12px;color:rgba(230,232,240,.7)}
.legend.show{display:flex}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.right{position:absolute;right:24px;top:18px;display:flex;gap:10px}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid rgba(246,214,140,.25);background:rgba(246,214,140,.04);
  color:#f6d68c;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.icon:hover{background:rgba(246,214,140,.12)}
.tip{position:absolute;pointer-events:none;color:#fbe9bd;font-size:13px;letter-spacing:1px;white-space:nowrap;
  text-shadow:0 0 10px rgba(0,0,0,.9);opacity:0;transition:opacity .15s}
.card2{position:absolute;right:24px;bottom:24px;width:250px;padding:14px 16px;border-radius:12px;
  background:rgba(14,11,4,.78);border:1px solid rgba(246,214,140,.18);display:none;backdrop-filter:blur(6px)}
.card2.show{display:block;animation:fade .25s ease}
.card2 .n{font-size:15px;color:#f6d68c;margin-bottom:8px}
.card2 .bar{height:4px;border-radius:2px;background:rgba(246,214,140,.12);overflow:hidden}
.card2 .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a2a,#f6d68c)}
.card2 .s{font-size:12px;color:rgba(243,230,196,.6);margin-top:8px}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}
.toast.show{animation:toast 3.4s ease forwards}
.toast .b{font-size:34px;color:#f6d68c;letter-spacing:6px;text-shadow:0 0 24px rgba(246,214,140,.7)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
</style></head><body>

<div class="home">
  <h1>今日学习</h1>
  <div class="grid">
    <div class="card"><h3>我的知识星空</h3>
      <div class="mini" id="mini"><canvas id="miniCanvas"></canvas><div class="count"><b id="miniCount">0</b>颗星已点亮</div></div>
    </div>
    <div class="card"><h3>错题复习</h3><div class="stub"></div><div class="stub"></div><div class="stub"></div></div>
  </div>
</div>

<div class="sky" id="sky">

  <div class="top">

  <div class="card2" id="card2"></div>
  <div class="toast" id="toast"><div class="b" id="toastB"></div></div>

    for (const d of decor) glow(dx(d), dy(d), d.r * 4, .3 + .2 * Math.sin(time * .025 + d.p), PALETTE === 'rgy' ? '170,178,200' : true);
    ctx.save(); ctx.translate(T.x, T.y); ctx.scale(T.k, T.k);
    // 连线
    for (const l of links) {
      const v = Math.min(l.source.value, l.target.value), m = Math.min(dim(l.source), dim(l.target));
      const a = (l.kind === 'prereq' ? .16 + v * .6 : .1 + v * .42) * m;
      const on = hover && (l.source === hover || l.target === hover);
      const lc = PALETTE === 'rgy' ? mix(nodeColor(l.source).split(',').map(Number), nodeColor(l.target).split(',').map(Number), .5).join(',')
        : (on ? '255,220,150' : '255,196,110');
      ctx.strokeStyle = `rgba(${on ? lighten(lc, .25) : lc},${on ? .95 : a})`;
      ctx.lineWidth = (on ? 1.8 : l.kind === 'prereq' ? .9 : .6) / Math.sqrt(T.k);
      ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke();
    }
    // 能量流
    for (const f of flows) {
      const on = hover && (f.l.source === hover || f.l.target === hover);
      f.t = (f.t + f.sp * (on ? 2.5 : 1)) % 1; const s = f.l.source, t = f.l.target;
      glow(s.x + (t.x - s.x) * f.t, s.y + (t.y - s.y) * f.t, (on ? 6 : 4) * S, on ? .95 : .55, PALETTE === 'rgy' ? nodeColor(t) : true);
    }
    // 星星
    for (const n of nodes) {
      const v = Math.max(n.value, .05), r = size(n), m = dim(n), warm = isGold(n) || n.value >= .5;
      const breathe = .85 + .15 * Math.sin(time * .03 + n.x * .05);
      const nc = nodeColor(n);
      if (PALETTE === 'rgy') {
        // 红黄绿：不画星芒，只用光晕的大小和强弱表示掌握程度（掌握得越好光晕越大越亮）
        if (n.value >= .1) { glow(n.x, n.y, r * (2.5 + v * 9) * breathe, .18 + v * .62, nc);
          if (v >= .6) glow(n.x, n.y, r * (1.5 + v * 3), .25 + (v - .6) * 1.2, lighten(nc, .3)); }
      } else glow(n.x, n.y, r * (3 + v * 5 + (isGold(n) ? 2.5 : 0)) * breathe, (.22 + v * .55) * m, warm);
      ctx.fillStyle = PALETTE === 'rgy' ? `rgba(${lighten(nc, .35)},${n.value < .1 ? .35 : .9})`
        : warm ? `rgba(255,236,196,${(.35 + v * .65) * m})` : `rgba(220,218,206,${(.2 + v * .6) * m})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r * (n.value < .1 ? .7 : 1), 0, 6.283); ctx.fill();
      if (hot(n)) glow(n.x, n.y, r * (n === hover ? 10 : 6), n === hover ? .55 : .3, PALETTE === 'rgy' ? nc : true);
      if (n === hover) for (let k = 0; k < 2; k++) { const ph = ((time * .012) + k * .5) % 1;
        ctx.strokeStyle = `rgba(${PALETTE === 'rgy' ? lighten(nc, .3) : '255,220,150'},${(1 - ph) * .8})`; ctx.lineWidth = 1.2 / T.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + ph * 26, 0, 6.283); ctx.stroke(); }
      if (PALETTE !== 'rgy' && (isGold(n) || n.kind === 'vocab' || n === hover)) flare(n.x, n.y, r * (n.kind === 'point' ? 11 : 14) * breathe, .85 * m, time * .0015 + n.x, PALETTE === 'rgy' ? nc : null);
    }
    // 点亮时刻的光环与迸发
    for (let i = rings.length - 1; i >= 0; i--) { const g = rings[i]; g.r += 1.6; g.a *= .965;
      if (g.a < .02) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(${accent()},${g.a})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, 6.283); ctx.stroke(); }
    for (let i = bursts.length - 1; i >= 0; i--) { const b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vx *= .96; b.vy *= .96; b.life--;
      if (b.life <= 0) { bursts.splice(i, 1); continue; } glow(b.x, b.y, b.r * 3, b.life / b.max, PALETTE === 'rgy' ? accent() : true); }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const api = {nodes, sim, setHover(n) { hover = n; if (!n) { near = null; return; }
      near = new Set([n.id]); links.forEach(l => { if (l.source.id === n.id) near.add(l.target.id); if (l.target.id === n.id) near.add(l.source.id); }); },
    find(px, py) { const [x, y] = T.invert([px, py]); let best = null, bd = 1e9;
      for (const n of nodes) { const d = Math.hypot(n.x - x, n.y - y); if (d < bd && d < size(n) + 10 / T.k) { bd = d; best = n; } } return best; },
    toScreen(n) { return T.apply([n.x, n.y]); },
    setTransform(t) { T = t; },
    light(n) { n.value = MASTERED; rings.push({x: n.x, y: n.y, r: size(n), a: .9});
      for (let i = 0; i < 110; i++) { const a = Math.random() * 6.28, v = Math.random() * 2.2 + .4, life = 50 + Math.random() * 60;
        bursts.push({x: n.x, y: n.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 1.2 + .5, life, max: life}); } }};
  return api;
}

// ---------- 首页缩略图 ----------
const miniSky = Sky(document.getElementById('miniCanvas'), DATA.math, 'math', true);
document.getElementById('miniCount').textContent = lit(DATA.math) + lit(DATA.english);

// ---------- 全屏 ----------
const canvas = document.getElementById('skyCanvas'), tip = document.getElementById('tip'), card = document.getElementById('card2');
let sky = null, subject = 'math';
const zoom = d3.zoom().scaleExtent([.4, 4]).on('zoom', e => sky && sky.setTransform(e.transform));
d3.select(canvas).call(zoom);
function open(s) {
  subject = s; card.classList.remove('show');
  document.querySelectorAll('.tabs:not(.pal) button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  // 每次切换重建一张星空（旧的停止漂动）
  if (sky) sky.sim.stop();
  canvas.replaceWith(canvas); sky = Sky(canvas, DATA[s], s, false); d3.select(canvas).call(zoom.transform, d3.zoomIdentity);
  document.getElementById('count2').innerHTML = `<b>${lit(DATA[s])}</b> 颗已点亮`;
}
canvas.addEventListener('mousemove', e => {
  if (!sky) return; const n = sky.find(e.offsetX, e.offsetY); sky.setHover(n);
  canvas.style.cursor = n ? 'pointer' : 'grab';
  if (n) { const [x, y] = sky.toScreen(n); tip.textContent = n.id; tip.style.left = (x + 12) + 'px'; tip.style.top = (y - 10) + 'px'; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
});
canvas.addEventListener('mouseleave', () => { sky && sky.setHover(null); tip.style.opacity = 0; });
canvas.addEventListener('click', e => {
  const n = sky && sky.find(e.offsetX, e.offsetY); if (!n) { card.classList.remove('show'); return; }
  const pct = Math.round(n.value * 100);
  const state = n.kind === 'vocab' ? `已掌握 ${n.mastered} / ${n.total} 个词` : n.value < .1 ? '还没学' : n.value >= MASTERED ? '已掌握' : n.value < .4 ? '需要加油' : '继续练习，会更亮';
  card.innerHTML = `<div class="n">${n.id}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s">${state}</div>`;
  card.classList.add('show');
});
function moment() {
  const picks = sky.nodes.filter(n => n.kind === 'point' && n.value >= .5 && n.value < MASTERED).slice(0, 3);
  document.getElementById('toastB').textContent = `点亮了 ${picks.length} 颗星`;
  const t = document.getElementById('toast'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  picks.forEach((n, i) => setTimeout(() => sky.light(n), 700 + i * 450));
  setTimeout(() => document.getElementById('count2').innerHTML = `<b>${sky.nodes.filter(n => n.kind === 'point' && n.value >= MASTERED).length}</b> 颗已点亮`, 2200);
}
document.getElementById('mini').onclick = () => { document.getElementById('sky').classList.add('show'); open('math'); };
document.getElementById('close').onclick = () => document.getElementById('sky').classList.remove('show');
document.getElementById('moment').onclick = moment;
document.querySelectorAll('.tabs:not(.pal) button').forEach(b => b.onclick = () => open(b.dataset.s));
document.querySelectorAll('.pal button').forEach(b => b.onclick = () => { PALETTE = b.dataset.p;
  document.querySelectorAll('.pal button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('legend').classList.toggle('show', PALETTE === 'rgy'); });
</script></body></html>
