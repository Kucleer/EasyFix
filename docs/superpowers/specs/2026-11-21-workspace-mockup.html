<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyFix 新菜单、首页与翻一翻 · 精修样稿</title>
<!--
  项目 5 的精修样稿：菜单结构、首页、翻一翻的样子以本文件为准。
  用浏览器直接打开即可；右上角可切换电脑 / 手机。数字和题目都是示例。
  不依赖任何外部字体、图标或脚本。
-->
<style>
  /* ========== 设计变量 ========== */
  :root {
    --bg: #f3f2fa;            /* 页面底色：带一点紫的暖白 */
    --surface: #ffffff;
    --ink: #1f2340;           /* 主文字 */
    --ink-2: #4c5372;         /* 次要文字 */
    --muted: #686e89;         /* 说明文字（白底上对比度约 4.9:1） */
    --line: #e6e5f2;
    --brand: #4f46e5;         /* 沿用现有主色 */
    --brand-deep: #3b33b8;
    --brand-soft: #ecebff;
    --mint: #17895a;          /* 进步、完成 */
    --mint-deep: #0f6e47;
    --mint-soft: #e2f5ec;
    --sun: #b4641a;           /* 需要留意（沿用周报的橙棕） */
    --sun-soft: #fdf1df;
    --coral: #d6455a;         /* 待办数字 */
    --coral-soft: #fdecef;
    --night: #14162b;         /* 知识星空卡的夜色 */
    --r-lg: 22px; --r-md: 16px; --r-sm: 10px;
    --shadow-1: 0 1px 2px rgba(31,35,64,.05), 0 6px 18px rgba(31,35,64,.06);
    --shadow-2: 0 2px 4px rgba(31,35,64,.06), 0 16px 36px rgba(31,35,64,.12);
    --font: 'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Segoe UI',sans-serif;
    --font-num: ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',var(--font);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dbe8; color: var(--ink); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 3px solid #a5a0f5; outline-offset: 2px; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ========== 样稿自己的说明条（不属于产品） ========== */
  .demo-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 18px; background: var(--night); color: #fff; }
  .demo-bar b { font-size: 15px; }
  .demo-bar span { color: #b9bdd6; font-size: 13px; }
  .demo-switch { margin-left: auto; display: flex; background: #2a2d4a; border-radius: 10px; padding: 3px; }
  .demo-switch button { color: #b9bdd6; padding: 6px 18px; border-radius: 8px; }
  .demo-switch button.on { background: #fff; color: var(--ink); font-weight: 600; }
  .stage { padding: 22px 16px 48px; display: flex; justify-content: center; }

  /* ========== 外壳 ========== */
  .shell { background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 20px 60px rgba(20,22,43,.25); }
  .shell.pc { width: 1160px; max-width: 100%; height: 800px; border-radius: 16px; display: flex; }
  .shell.phone { width: 392px; height: 800px; border-radius: 40px; border: 10px solid var(--night); display: flex; flex-direction: column; }

  /* ---- 电脑侧栏 ---- */
  .sidebar { width: 212px; flex-shrink: 0; padding: 20px 14px; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .brand i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-style: normal; font-family: var(--font-num);
    background: linear-gradient(140deg, #6a62f2, var(--brand-deep)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 4px 10px rgba(79,70,229,.35); }
  .nav-label { margin: 16px 10px 6px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .nav-link { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--ink-2); text-align: left; transition: background .18s, color .18s; }
  .nav-link:hover { background: var(--bg); }
  .nav-link.on { background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
  .nav-link .tail { margin-left: auto; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--coral); color: #fff; font-size: 12px; line-height: 20px; text-align: center; font-weight: 700; font-family: var(--font-num); }
  .new-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: var(--mint-soft); color: var(--mint-deep); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 14px 10px 0; font-size: 12px; color: var(--muted); }

  .main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 34px 36px; scroll-behavior: smooth; }
  .shell.phone .sidebar { display: none; }
  .shell.phone .main { padding: 18px 16px 22px; }

  /* ---- 手机底部导航 ---- */
  .bottom { display: none; }
  .shell.phone .bottom { display: flex; flex-shrink: 0; padding: 6px 8px 10px; background: var(--surface); border-top: 1px solid var(--line); }
  .bottom button { flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; color: var(--muted); font-size: 11.5px; border-radius: 14px; transition: color .18s; }
  .bottom button .pill { width: 46px; height: 28px; border-radius: 14px; display: grid; place-items: center; transition: background .18s; }
  .bottom button.on { color: var(--brand-deep); font-weight: 600; }
  .bottom button.on .pill { background: var(--brand-soft); }
  .bottom .badge { position: absolute; top: 2px; left: calc(50% + 8px); }

  /* ---- 手机“更多”抽屉 ---- */
  .mask { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: rgba(20,22,43,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .mask.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; padding: 10px 14px 22px; background: var(--surface); border-radius: 24px 24px 0 0; transform: translateY(24px); transition: transform .22s ease-out; }
  .mask.open .sheet { transform: none; }
  .sheet::before { content: ''; display: block; width: 40px; height: 4px; margin: 0 auto 12px; border-radius: 2px; background: var(--line); }

  /* ========== 首页 ========== */
  .hello { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
  .hello .date { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  /* 每日一句：每天换一句，对学生说 */
  .hello h1 { position: relative; margin: 0; padding-left: 20px; font-size: 26px; line-height: 1.4; letter-spacing: .3px; }
  .hello h1::before { content: ''; position: absolute; left: 0; top: .32em; bottom: .32em; width: 6px; border-radius: 3px; background: linear-gradient(180deg, #7b74f7, var(--brand)); }
  .streak { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--surface); color: var(--sun); font-weight: 600; font-size: 13px; box-shadow: var(--shadow-1); white-space: nowrap; }
  .shell.phone .hello { flex-direction: column; align-items: flex-start; gap: 10px; }
  .shell.phone .hello h1 { font-size: 21px; padding-left: 16px; }
  .shell.phone .streak { margin-left: 0; }

  /* 学生的两张大卡 */
  .kid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .shell.phone .kid { grid-template-columns: 1fr; gap: 12px; }
  .kid-card { position: relative; overflow: hidden; min-height: 168px; padding: 22px 24px; border-radius: var(--r-lg); color: #fff; text-align: left; display: flex; flex-direction: column;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-2); transition: transform .16s ease-out, box-shadow .16s ease-out; }
  .kid-card:hover { transform: translateY(-2px); }
  .kid-card:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.14), var(--shadow-1); }
  .kid-card.words { background: linear-gradient(145deg, #6d65f5 0%, #4f46e5 55%, #3b33b8 100%); }
  .kid-card.flip { background: linear-gradient(145deg, #2fb37f 0%, #17895a 55%, #0f6e47 100%); }
  .kid-card .eyebrow { font-size: 13px; opacity: .85; letter-spacing: 1px; }
  .kid-card .title { font-size: 26px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
  .kid-card .count { margin-top: auto; display: flex; align-items: baseline; gap: 6px; font-size: 15px; }
  .kid-card .count .num { font-size: 40px; line-height: 1; }
  .kid-card .start { position: absolute; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .kid-card.words .start { color: var(--brand-deep); }
  .kid-card.flip .start { color: var(--mint-deep); }
  .shell.phone .kid-card { min-height: 138px; padding: 18px 20px; }
  .shell.phone .kid-card .title { font-size: 23px; }
  .shell.phone .kid-card .count .num { font-size: 34px; }
  /* 卡片右上角的装饰：字母块 / 叠起来的卡片 */
  .deco { position: absolute; right: 18px; top: 16px; width: 120px; height: 84px; pointer-events: none; }
  .tile { position: absolute; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 700 24px var(--font-num); background: rgba(255,255,255,.18); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.3); }
  .tile:nth-child(1) { left: 0; top: 22px; transform: rotate(-10deg); }
  .tile:nth-child(2) { left: 38px; top: 2px; transform: rotate(6deg); background: rgba(255,255,255,.28); }
  .tile:nth-child(3) { left: 76px; top: 26px; transform: rotate(-4deg); }
  .mini { position: absolute; width: 62px; height: 78px; border-radius: 12px; background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .mini:nth-child(1) { right: 44px; top: 6px; transform: rotate(-12deg); }
  .mini:nth-child(2) { right: 22px; top: 2px; transform: rotate(-2deg); background: rgba(255,255,255,.28); }
  .mini:nth-child(3) { right: 0; top: 6px; transform: rotate(9deg); background: rgba(255,255,255,.92); display: grid; place-items: center; color: var(--mint); }
  .mini:nth-child(3) svg { width: 28px; height: 28px; stroke-width: 2.6; }

  .zone { display: flex; align-items: center; gap: 12px; margin: 30px 0 12px; font-size: 13px; color: var(--muted); letter-spacing: 1.5px; }
  .zone::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .shell.phone .zone { margin: 22px 0 10px; }

  /* 家长待办 */
  .todo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .shell.phone .todo { grid-template-columns: 1fr; gap: 10px; }
  .todo-item { min-height: 76px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); text-align: left; box-shadow: var(--shadow-1); border: 1px solid transparent; transition: border-color .18s, box-shadow .18s; }
  .todo-item:hover { border-color: #cfcbf7; box-shadow: var(--shadow-2); }
  .todo-item .dot { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .todo-item.hot .dot { background: var(--coral-soft); color: var(--coral); }
  .todo-item.calm .dot { background: var(--brand-soft); color: var(--brand); }
  .todo-item b { display: block; font-size: 15px; }
  .todo-item small { color: var(--muted); font-size: 13px; }
  .todo-item .go { margin-left: auto; color: #a3a7bd; }

  /* 这一周 */
  .week { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; }
  .shell.phone .week { grid-template-columns: 1fr; gap: 12px; }
  .card { padding: 20px 22px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); }
  .shell.phone .card { padding: 16px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-head b { font-size: 16px; }
  .link { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--brand); font-weight: 600; font-size: 14px; min-height: 44px; padding: 0 4px; }
  .link svg { width: 16px; height: 16px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 16px; }
  .day { text-align: center; font-size: 12px; color: var(--muted); }
  .day i { display: grid; place-items: center; height: 38px; margin-bottom: 4px; border-radius: 12px; background: var(--bg); color: transparent; font-style: normal; }
  .day.done i { background: var(--mint-soft); color: var(--mint); }
  .day.today i { box-shadow: 0 0 0 2px var(--brand); }
  .day.future i { background: none; border: 1.5px dashed var(--line); }
  .day svg { width: 18px; height: 18px; stroke-width: 2.6; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .shell.phone .nums { grid-template-columns: repeat(2, 1fr); }
  .nums div { padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg); }
  .nums .num { font-size: 22px; line-height: 1.2; }
  .nums .num small { font: 600 13px var(--font); margin-left: 2px; }
  .nums span { display: block; font-size: 12.5px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip svg { width: 14px; height: 14px; stroke-width: 2.6; }
  .chip.up { background: var(--mint-soft); color: var(--mint-deep); }
  .chip.down { background: var(--sun-soft); color: var(--sun); }

  /* 知识星空卡：夜色 */
  .sky { position: relative; overflow: hidden; padding: 20px 22px; border-radius: var(--r-lg); color: #fff; text-align: left; display: flex; flex-direction: column; min-height: 220px;
    background: radial-gradient(120% 90% at 80% 0%, #2c2f63 0%, var(--night) 60%); box-shadow: var(--shadow-2); }
  .sky::before { content: ''; position: absolute; inset: 0; opacity: .9; background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 28% 64%, #cfd3ff 50%, transparent 51%),
    radial-gradient(1.8px 1.8px at 46% 14%, #ffe9a8 50%, transparent 51%), radial-gradient(1.2px 1.2px at 63% 48%, #fff 50%, transparent 51%),
    radial-gradient(2.2px 2.2px at 82% 30%, #9ff0c8 50%, transparent 51%), radial-gradient(1.2px 1.2px at 90% 72%, #cfd3ff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 37% 86%, #ffb3bd 50%, transparent 51%), radial-gradient(1.2px 1.2px at 72% 88%, #fff 50%, transparent 51%); }
  .sky > * { position: relative; }
  .sky b { font-size: 16px; }
  .sky p { margin: 2px 0 0; font-size: 13px; color: #b9bdd6; }
  .sky-nums { display: flex; gap: 10px; margin-top: auto; }
  .sky-nums div { flex: 1; padding: 10px 8px; border-radius: 14px; text-align: center; background: rgba(255,255,255,.08); }
  .sky-nums .num { display: block; font-size: 24px; line-height: 1.2; }
  .sky-nums span { font-size: 12px; color: #c9cce2; }
  .sky .weak { color: #ffb3bd; } .sky .mid { color: #ffe9a8; } .sky .good { color: #9ff0c8; }
  .sky .link { color: #d7d4ff; margin: 10px 0 -8px; }

  .foot-note { margin-top: 18px; font-size: 12.5px; color: var(--muted); }

  /* ========== 翻一翻 ========== */
  .flip-page { max-width: 480px; margin: 0 auto; }
  .flip-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .flip-top b { font-size: 17px; }
  .seg { flex: 1; display: flex; gap: 5px; }
  .seg i { flex: 1; height: 8px; border-radius: 4px; background: #dddbee; transition: background .25s; }
  .seg i.done { background: var(--mint); }
  .seg i.now { background: #9be0c0; }
  .deck { position: relative; padding-bottom: 14px; }
  .deck::before, .deck::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 40px; border-radius: var(--r-lg); background: #fff; box-shadow: var(--shadow-1); opacity: .7; }
  .deck::after { left: 24px; right: 24px; bottom: 0; opacity: .45; }
  .qcard { position: relative; z-index: 1; min-height: 372px; display: flex; flex-direction: column; padding: 22px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-2); animation: card-in .28s ease-out; }
  @keyframes card-in { from { opacity: 0; transform: translateX(26px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
  .qtag { align-self: flex-start; padding: 3px 11px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-deep); font-size: 13px; font-weight: 600; }
  .qstem { margin: 14px 0 16px; font-size: 19px; line-height: 1.65; }
  .mine, .right { padding: 11px 14px; border-radius: 14px; }
  .mine { background: var(--coral-soft); color: #a8303f; }
  .mine small, .right small { display: block; font-size: 12.5px; opacity: .85; }
  .mine b, .right b { font-size: 17px; }
  .right { margin-top: 10px; background: var(--mint-soft); color: var(--mint-deep); animation: reveal .26s ease-out; }
  .right p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .grow { flex: 1; min-height: 16px; }
  .btn { width: 100%; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; font-size: 17px; font-weight: 700; transition: transform .14s ease-out, box-shadow .14s ease-out; }
  .btn:active { transform: translateY(2px); }
  .btn.primary { background: var(--brand); color: #fff; box-shadow: inset 0 -4px 0 var(--brand-deep), 0 6px 14px rgba(79,70,229,.3); }
  .btn.yes { background: var(--mint); color: #fff; box-shadow: inset 0 -4px 0 var(--mint-deep), 0 6px 14px rgba(23,137,90,.28); }
  .btn.no { background: #fff; color: var(--sun); box-shadow: inset 0 0 0 2px #edcf9f, inset 0 -4px 0 #f3e2c4; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .flip-hint { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .finish { text-align: center; padding: 56px 12px 20px; }
  .medal { width: 108px; height: 108px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(145deg, #2fb37f, #0f6e47); box-shadow: inset 0 -6px 0 rgba(0,0,0,.16), 0 0 0 10px var(--mint-soft), var(--shadow-2); animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
  .medal svg { width: 52px; height: 52px; stroke-width: 3; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .finish h1 { margin: 0 0 6px; font-size: 26px; }
  .finish p { margin: 0 0 24px; color: var(--muted); }

  /* ========== 其他页面（这一稿只示意结构） ========== */
  .page-head h1 { margin: 0; font-size: 24px; }
  .page-head p { margin: 4px 0 18px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding: 4px; border-radius: 14px; background: #e9e8f4; width: fit-content; max-width: 100%; }
  .tabs button { min-height: 38px; padding: 0 16px; border-radius: 10px; color: var(--ink-2); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tabs button.on { background: var(--surface); color: var(--brand-deep); font-weight: 600; box-shadow: var(--shadow-1); }
  .from { display: inline-block; margin-bottom: 10px; padding: 2px 10px; border-radius: 8px; background: var(--sun-soft); color: var(--sun); font-size: 12.5px; }
  .holder { padding: 30px 20px; border-radius: var(--r-md); border: 1.5px dashed #cfcde3; background: rgba(255,255,255,.6); text-align: center; color: var(--muted); }
  .holder + .holder { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="demo-bar">
  <b>EasyFix · 精修样稿</b>
  <span>菜单、首页、翻一翻可以点着走一遍；其余页面只示意结构。数字和题目都是示例。</span>
  <div class="demo-switch">
    <button id="sw-pc" class="on" onclick="set_device('pc')">电脑</button>
    <button id="sw-phone" onclick="set_device('phone')">手机</button>
  </div>
</div>

<div class="stage">
  <div id="shell" class="shell pc">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <nav class="bottom" id="bottom" aria-label="手机导航"></nav>
    <div class="mask" id="mask" onclick="close_sheet(event)"><div class="sheet" id="sheet"></div></div>
  </div>
</div>

<script>
// ===== 图标：统一的线条图标，不用表情符号 =====
const ICON_PATHS = {
  home: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  words: 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z',
  flip: 'M12 3l9 5-9 5-9-5z M3 13l9 5 9-5 M3 17.5l9 5 9-5',
  reading: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h6',
  questions: 'M9 4h6v3H9z M7 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1 M9.5 12l5 5 M14.5 12l-5 5',
  practice: 'M7 9V3h10v6 M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2 M7 14h10v7H7z',
  weekly: 'M4 6h16v15H4z M4 10h16 M8 3v4 M16 3v4',
  insight: 'M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z',
  settings: 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M16 4v4 M10 10v4 M18 16v4',
  more: 'M5 12h.01 M12 12h.01 M19 12h.01',
  arrow: 'M5 12h14 M13 6l6 6-6 6',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  plus: 'M12 5v14 M5 12h14',
  again: 'M4 12a8 8 0 0 1 14-5.3L20 9 M20 4v5h-5 M20 12a8 8 0 0 1-14 5.3L4 15 M4 20v-5h5',
  up: 'M12 19V5 M6 11l6-6 6 6',
  down: 'M12 5v14 M6 13l6 6 6-6',
  flame: 'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',
}
// 生成一个图标的 SVG 字符串
function icon(name) { return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_PATHS[name]}"/></svg>` }

// ===== 新菜单：13 个入口减到 8 个（加上新的“翻一翻”共 9 项） =====
const NAV = [
  { label: '', items: [{ id: 'home', name: '首页' }] },
  { label: '学生用', items: [{ id: 'words', name: '单词' }, { id: 'flip', name: '翻一翻', is_new: true }, { id: 'reading', name: '阅读' }] },
  { label: '家长用', items: [{ id: 'questions', name: '错题', badge: 3 }, { id: 'practice', name: '练习' }] },
  { label: '看成果', items: [{ id: 'weekly', name: '周报' }, { id: 'insight', name: '学情' }] },
  { label: '', items: [{ id: 'settings', name: '设置' }] },
]
const BOTTOM_IDS = ['home', 'words', 'questions', 'practice']   // 手机底部固定四格，第五格是“更多”

// 翻一翻的示例卡片
const CARDS = [
  { tag: '数学 · 分数除法', stem: '一根绳子长 3/4 米，每 3/8 米剪一段，可以剪成几段？', mine: '9/32 段', ans: '2 段', why: '求“有几个 3/8”要用除法：3/4 ÷ 3/8 = 3/4 × 8/3 = 2。上次用成了乘法。' },
  { tag: '英语 · 一般现在时', stem: 'My sister ______ (go) to school by bus every day.', mine: 'go', ans: 'goes', why: '主语 My sister 是第三人称单数，动词要加 -es。' },
  { tag: '数学 · 比的应用', stem: '甲、乙两数的比是 3 : 5，两数的和是 40，甲数是多少？', mine: '24', ans: '15', why: '一共 3 + 5 = 8 份，每份 40 ÷ 8 = 5，甲占 3 份：3 × 5 = 15。' },
  { tag: '英语 · 介词搭配', stem: 'She is good ______ playing the piano.', mine: 'in', ans: 'at', why: '固定搭配 be good at：擅长做某事。' },
]

let current_page = 'home'
let flip_index = 0
let flip_shown = false
let question_tab = 'review'

// 所有菜单项摊平，方便按 id 查
function all_items() { return NAV.flatMap(group => group.items) }

// 切换电脑 / 手机外壳
function set_device(device) {
  document.getElementById('shell').className = 'shell ' + device
  document.getElementById('sw-pc').className = device === 'pc' ? 'on' : ''
  document.getElementById('sw-phone').className = device === 'phone' ? 'on' : ''
}

// 跳到某个页面
function go(page) {
  current_page = page
  if (page === 'flip') { flip_index = 0; flip_shown = false }
  document.getElementById('mask').classList.remove('open')
  render()
  document.getElementById('main').scrollTop = 0
}

// 菜单项右侧的小尾巴：红色数字或“新”
function tail_of(item) {
  if (item.badge) return `<b class="badge tail">${item.badge}</b>`
  if (item.is_new) return '<span class="new-tag tail">新</span>'
  return ''
}

// 画电脑侧栏
function render_sidebar() {
  let html = '<div class="brand"><i>E</i>EasyFix</div>'
  for (const group of NAV) {
    if (group.label) html += `<p class="nav-label">${group.label}</p>`
    for (const item of group.items) {
      html += `<button class="nav-link ${item.id === current_page ? 'on' : ''}" onclick="go('${item.id}')">${icon(item.id)}<span>${item.name}</span>${tail_of(item)}</button>`
    }
  }
  html += '<p class="side-foot">每一次订正，都是新的进步。</p>'
  document.getElementById('sidebar').innerHTML = html
}

// 画手机底部导航和“更多”抽屉
function render_bottom() {
  const items = all_items()
  let html = ''
  for (const id of BOTTOM_IDS) {
    const item = items.find(one => one.id === id)
    html += `<button class="${id === current_page ? 'on' : ''}" onclick="go('${id}')"><span class="pill">${icon(id)}</span>${item.name}${item.badge ? `<b class="badge">${item.badge}</b>` : ''}</button>`
  }
  const in_more = !BOTTOM_IDS.includes(current_page)
  html += `<button class="${in_more ? 'on' : ''}" onclick="document.getElementById('mask').classList.add('open')"><span class="pill">${icon('more')}</span>更多</button>`
  document.getElementById('bottom').innerHTML = html

  let sheet = ''
  for (const item of items.filter(one => !BOTTOM_IDS.includes(one.id))) {
    sheet += `<button class="nav-link ${item.id === current_page ? 'on' : ''}" onclick="go('${item.id}')">${icon(item.id)}<span>${item.name}</span>${tail_of(item)}</button>`
  }
  document.getElementById('sheet').innerHTML = sheet
}

// 点抽屉外面的灰色区域时关闭
function close_sheet(event) { if (event.target.id === 'mask') event.target.classList.remove('open') }

// 每日一句：从一组写好的句子里按日期取一句，同一天所有人看到的是同一句，不调用模型
const DAILY_LINES = [
  '错过的题，再看一眼，就不容易再错。',
  '今天多记住一个词，明天就少查一次。',
  '慢一点没关系，弄懂了才算数。',
  '每一道订正过的题，都是你自己的本事。',
]
function daily_line() {
  const day_number = Math.floor(Date.now() / 86400000)   // 从 1970 年算起的第几天
  return DAILY_LINES[day_number % DAILY_LINES.length]
}

// ===== 首页 =====
function page_home() {
  // 一周七天的打卡条：done 当天有学习记录，today 今天，future 还没到
  const days = [['一', 'done'], ['二', 'done'], ['三', ''], ['四', 'done'], ['五', 'done'], ['六', 'done today'], ['日', 'future']]
  return `
  <header class="hello">
    <div><p class="date">周六好 · 11 月 21 日</p><h1>${daily_line()}</h1></div>
    <span class="streak">${icon('flame')}已经连续 4 天</span>
  </header>

  <section class="kid" aria-label="学生的入口">
    <button class="kid-card words" onclick="go('words')">
      <span class="deco"><span class="tile">a</span><span class="tile">b</span><span class="tile">c</span></span>
      <span class="eyebrow">今天</span>
      <span class="title">背单词</span>
      <span class="count"><span class="num">23</span>个要温习</span>
      <span class="start">开始${icon('arrow')}</span>
    </button>
    <button class="kid-card flip" onclick="go('flip')">
      <span class="deco"><span class="mini"></span><span class="mini"></span><span class="mini">${icon('check')}</span></span>
      <span class="eyebrow">今天</span>
      <span class="title">翻一翻错题</span>
      <span class="count"><span class="num">${CARDS.length}</span>张，约 3 分钟</span>
      <span class="start">开始${icon('arrow')}</span>
    </button>
  </section>

  <div class="zone">家长待办</div>
  <section class="todo">
    <button class="todo-item hot" onclick="question_tab='review';go('questions')"><span class="dot num">3</span><span><b>道题待核对</b><small>昨天录入的数学作业</small></span><span class="go">${icon('arrow')}</span></button>
    <button class="todo-item hot" onclick="go('practice')"><span class="dot num">1</span><span><b>份卷子待批改</b><small>数学考点卷 · 11 月 18 日</small></span><span class="go">${icon('arrow')}</span></button>
    <button class="todo-item calm" onclick="go('practice')"><span class="dot">${icon('plus')}</span><span><b>出一份考点卷</b><small>上次出卷是 3 天前</small></span><span class="go">${icon('arrow')}</span></button>
  </section>

  <div class="zone">这一周</div>
  <section class="week">
    <div class="card">
      <div class="card-head"><b>11 月 16 日 – 22 日</b><button class="link" onclick="go('weekly')">看周报${icon('arrow')}</button></div>
      <div class="days">${days.map(([name, state]) => `<div class="day ${state}"><i>${icon('check')}</i>${name}</div>`).join('')}</div>
      <div class="nums">
        <div><span class="num">12<small>道</small></span><span>新录错题</span></div>
        <div><span class="num">1<small>份</small></span><span>练习卷</span></div>
        <div><span class="num">5<small>天</small></span><span>背了单词</span></div>
        <div><span class="num">4<small>天</small></span><span>翻了错题</span></div>
      </div>
      <div class="chips">
        <span class="chip up">${icon('up')}分数除法</span><span class="chip up">${icon('up')}一般现在时</span><span class="chip down">${icon('down')}比的应用</span>
      </div>
    </div>
    <button class="sky" onclick="go('insight')">
      <b>知识星空</b><p>每个考点是一颗星</p>
      <div class="sky-nums">
        <div><span class="num weak">39</span><span>还薄弱</span></div>
        <div><span class="num mid">3</span><span>一般</span></div>
        <div><span class="num good">3</span><span>已点亮</span></div>
      </div>
      <span class="link">看学情${icon('arrow')}</span>
    </button>
  </section>
  <p class="foot-note">没有待办时，前两格变成浅色并写“都处理完了”。去掉了旧首页的 9 张累计数字卡、昨日/今日对比、准确率曲线和学科难度分布表。</p>`
}

// ===== 翻一翻 =====
function page_flip() {
  if (flip_index >= CARDS.length) {
    return `<div class="flip-page"><div class="finish"><div class="medal">${icon('check')}</div><h1>今天翻完了</h1><p>${CARDS.length} 张都看过了，明天再来。</p><button class="btn primary" style="max-width:220px;margin:0 auto" onclick="go('home')">回首页</button></div></div>`
  }
  const card = CARDS[flip_index]
  const dots = CARDS.map((one, index) => `<i class="${index < flip_index ? 'done' : (index === flip_index ? 'now' : '')}"></i>`).join('')
  const answer = flip_shown ? `<div class="right"><small>正确答案</small><b>${card.ans}</b><p>${card.why}</p></div>` : ''
  const buttons = flip_shown
    ? `<div class="pair"><button class="btn no" onclick="next_card()">${icon('again')}我忘了</button><button class="btn yes" onclick="next_card()">${icon('check')}我记得</button></div>`
    : `<button class="btn primary" onclick="flip_shown=true;render()">想好了，看答案</button>`
  return `<div class="flip-page">
    <div class="flip-top"><b>翻一翻</b><div class="seg">${dots}</div><span class="num" style="color:var(--muted)">${flip_index + 1}/${CARDS.length}</span></div>
    <div class="deck"><article class="qcard" data-key="${flip_index}">
      <span class="qtag">${card.tag}</span>
      <p class="qstem">${card.stem}</p>
      <div class="mine"><small>你上次写的</small><b>${card.mine}</b></div>
      ${answer}
      <div class="grow"></div>
      ${buttons}
    </article></div>
    <p class="flip-hint">不用打字，也不打分。点“我忘了”的题，过两三天会再出现。</p>
  </div>`
}

// 翻到下一张
function next_card() { flip_index += 1; flip_shown = false; render() }

// ===== 其余页面：这一稿只示意合并后的结构 =====
function page_questions() {
  const tabs = [['review', '待核对', 3], ['all', '全部错题', 0], ['papers', '卷子和作业', 0]]
  const body = {
    review: '<span class="from">原来的独立菜单“待核对”</span><div class="holder">待核对的题目列表：通过 / 编辑后通过 / 做对了移除。<br>菜单上的红色数字点进来，直接落在这个标签。</div>',
    all: '<div class="holder">错题列表：搜索和筛选、详情、编辑。<br>右上角是“手工添加”一道题。去掉了“打印原题 / 打印相似题”，出卷只在“练习”里。</div>',
    papers: '<span class="from">原来的独立菜单“卷子和作业”</span><div class="holder">卷子和作业记录：类型、日期、分数、题目数。</div>',
  }
  return `<div class="page-head"><h1>错题</h1><p>错题从哪来、核对、管理，都在这一页。</p></div>
    <div class="tabs">${tabs.map(([id, name, count]) => `<button class="${question_tab === id ? 'on' : ''}" onclick="question_tab='${id}';render()">${name}${count ? `<b class="badge">${count}</b>` : ''}</button>`).join('')}</div>${body[question_tab]}`
}

function page_insight() {
  return `<div class="page-head"><h1>学情</h1><p>每个考点现在掌握得怎么样，只用“掌握度”这一套算法。</p></div>
    <span class="from">合并了“知识星空”和“知识点分析”</span>
    <div class="holder">上半页：知识星空</div>
    <div class="holder">下半页：按模块和考点的明细表（掌握度、最近几次对错、待重做的题数），点一行看这个考点的错题。<br>去掉了“学习建议”和旧算法的图表。</div>`
}

function page_settings() {
  const names = ['年级与学期', '学科', '标签', '知识点', '错题本', '知识星空', '模型']
  return `<div class="page-head"><h1>设置</h1><p>不常改的东西都在这里，进来只验一次密码。</p></div>
    <span class="from">合并了“资料管理”和“模型配置”</span>
    <div class="tabs">${names.map((name, index) => `<button class="${index === 0 ? 'on' : ''}">${name}</button>`).join('')}</div>
    <div class="holder">点到哪个标签，才加载哪个标签的数据。<br>成就相关的三个标签先收起来，等成就项目再放回来。</div>`
}

// 内容不在这次重写范围内的页面
function page_same(title, text) { return `<div class="page-head"><h1>${title}</h1><p>这一页的内容这次不重写。</p></div><div class="holder">${text}</div>` }

function render() {
  const pages = {
    home: page_home, flip: page_flip, questions: page_questions, insight: page_insight, settings: page_settings,
    words: () => page_same('单词', '现在的单词本和默写。默写页“字大、干扰少”的改版以后单独做。'),
    reading: () => page_same('阅读', '现在的阅读空间。手机上收在“更多”里。'),
    practice: () => page_same('练习', '现在的练习中心：出考点卷、待批改、批改都从这里进。<br>旧的批改和旧的出卷入口去掉，只留考点卷和批改页。'),
    weekly: () => page_same('周报', '现在的周报页，“旧报告”仍从这页里进。'),
  }
  document.getElementById('main').innerHTML = pages[current_page]()
  render_sidebar()
  render_bottom()
}

render()
</script>
</body>
</html>
